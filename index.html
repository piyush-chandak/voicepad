<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoicePad | Speak. Save. Remember</title>

    <!-- SEO Meta -->
    <meta name="description" content="A web-based voice note app that lets you speak, see live transcripts with punctuation, and save your notes." />
    <meta name="keywords" content="voice notes, speech to text, AI punctuation, audio transcription, note-taking app" />
    <meta name="author" content="Piyush Chandak" />

    <!-- Open Graph / Social Share -->
    <meta property="og:title" content="VoicePad | Speak. Save. Remember" />
    <meta property="og:description" content="A web-based voice note app that lets you speak, see live transcripts with punctuation, and save your notes." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://piyush-chandak.github.io/voicepad" />
    <meta property="og:image" content="https://piyush-chandak.github.io/voicepad/apple-touch-icon.png" />

    <!-- Favicon (classic) -->
    <link rel="icon" href="/favicon.ico" sizes="any">

    <!-- PNG favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <!-- Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- Shortcut icon (legacy, still supported) -->
    <link rel="shortcut icon" href="/favicon.ico">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
      body { font-family: 'Inter', sans-serif; }
      .waveform-container { height: 60px; transition: all 0.3s ease; }
      .note-card:hover { transform: translateY(-2px); }
    </style>
  </head>

  <body class="bg-slate-50 text-slate-900 min-h-screen">

  <div id="app" class="max-w-screen-2xl mx-auto px-4 py-8 md:px-8">
    <!-- Header -->
    <header class="flex justify-between items-center mb-10">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">VoicePad</h1>
        <p class="text-md text-slate-500">Speak. Save. Remember</p>
      </div>
      <div id="statusIndicator" class="fixed top-6 right-6 flex items-center gap-3 px-4 py-2 rounded-full bg-slate-200 shadow-md text-sm font-medium">
        <span id="statusDot" class="w-3 h-3 rounded-full bg-slate-400 animate-pulse"></span>
        <span id="statusText">Idle</span>
      </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-10">
      <!-- Draft Editor -->
      <section class="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 flex flex-col gap-6">
        <input type="text" id="titleInput" placeholder="Note Title..." 
          class="text-3xl font-bold focus:outline-none placeholder:text-slate-300 w-full">

        <div class="flex items-center gap-4 border-y border-slate-100 py-3">
          <select id="languageSelect" class="bg-transparent text-sm font-medium text-slate-600 focus:outline-none">
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="hi-IN">Hindi</option>
            <option value="fr-FR">French</option>
            <option value="es-ES">Spanish</option>
            <option value="de-DE">German</option>
          </select>
          <div class="h-4 w-px bg-slate-200"></div>
          <canvas id="waveform" class="waveform-container w-full rounded-md bg-slate-100"></canvas>
        </div>

        <textarea id="contentInput" placeholder="Start speaking or type here..." 
          class="min-h-[300px] text-lg leading-relaxed focus:outline-none resize-none placeholder:text-slate-300 w-full rounded-md border border-slate-200 p-3"></textarea>

        <div class="flex flex-wrap items-center justify-between gap-4 pt-6 border-t border-slate-100">
          <div class="flex gap-3">
            <div class="flex flex-wrap gap-3 justify-center md:justify-start mt-4">
              <!-- Record Button -->
              <button id="recordBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-full font-semibold transition-all shadow-md shadow-blue-200">
                Record
              </button>

              <!-- Stop Button -->
              <button id="stopBtn" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded-full font-semibold transition-all shadow-md shadow-red-200">
                Stop
              </button>

              <!-- Clear Button -->
              <button id="clearBtn" class="bg-cyan-500 hover:bg-cyan-600 text-white px-6 py-2.5 rounded-full font-semibold transition-all shadow-md shadow-cyan-200">
                Clear
              </button>

              <!-- Copy Button -->
              <button id="copyBtn" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2.5 rounded-full font-semibold transition-all shadow-md shadow-green-200">
                Copy
              </button>
            </div>
          </div>
          <button id="saveBtn" class="bg-slate-900 hover:bg-black text-white px-8 py-2.5 rounded-xl font-medium transition-all">Save Note</button>
        </div>
      </section>

      <!-- Notes List -->
      <section class="lg:col-span-5">
        <h2 class="text-xl font-semibold mb-6 flex items-center gap-2">
          Saved Notes 
          <span id="noteCount" class="text-sm font-normal text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md">0</span>
        </h2>
        <div id="notesList" class="grid gap-4 max-h-[70vh] overflow-y-auto pr-2"></div>
      </section>
    </main>
  </div>

  <!-- Link to external JS -->
  <script src="app.js" type="module"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FV1KFFW8WB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-FV1KFFW8WB');
  </script>


</body>
</html>
